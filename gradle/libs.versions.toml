# The only place versions live (ARCHITECTURE 1.1). Exact stable pins, no prereleases (D34).
# Every pin here was resolved from Google Maven or Maven Central by a green build on forge;
# see DECISIONS-W1.md for the date and the reasons.
# A new dependency also needs an entry in build-logic ModuleRules (rule 6) or checkModuleGraph fails.

[versions]
agp = "9.4.1"
kotlin = "2.4.21"
coroutines = "1.11.0"
serialization = "1.11.0"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
navigation3 = "1.2.0"
profileinstaller = "1.4.1"
okio = "3.18.2"
bouncycastle = "1.86"
baselineprofile = "1.5.0"
benchmark = "1.5.0"
androidx-test-runner = "1.7.0"
uiautomator = "2.4.0"
androidx-test-ext-junit = "1.3.0"
junit4 = "4.13.2"
robolectric = "4.17"
roborazzi = "1.76.0"
turbine = "1.2.1"
kotest = "6.2.6"
apksig = "9.4.1"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
